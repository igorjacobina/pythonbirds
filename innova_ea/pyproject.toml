[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "innova-ea"
version = "0.1.0"
description = "High-performance research & backtesting platform for algorithmic Forex trading"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "INNOVA EA" }]
dependencies = [
    "polars>=0.20",
    "numpy>=1.24",
    "numba>=0.58",
    "pyarrow>=14",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]   # Windows only
dl = ["torch>=2.1"]             # Super Cérebro (Transformer); GPU recomendado
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
